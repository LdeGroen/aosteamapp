<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Achtergrond verloop -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" /> <!-- Slate 800 -->
      <stop offset="100%" stop-color="#020617" /> <!-- Slate 950 -->
    </linearGradient>
    
    <!-- Zwaardkling verloop -->
    <linearGradient id="swordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    
    <!-- Kleur Team 1 (Emerald) -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <!-- Kleur Team 2 (Rose) -->
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    
    <!-- Gloed effect voor de center node -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Basis vierkant met afgeronde hoeken (App Icoon Vorm) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Pairings Matrix / Netwerk op de achtergrond -->
  <g stroke="#334155" stroke-width="4" fill="none" opacity="0.6">
    <circle cx="120" cy="120" r="12" fill="#1e293b" />
    <circle cx="392" cy="120" r="12" fill="#1e293b" />
    <circle cx="120" cy="392" r="12" fill="#1e293b" />
    <circle cx="392" cy="392" r="12" fill="#1e293b" />
    <!-- Verbindingslijnen -->
    <path d="M120,120 L392,392 M120,392 L392,120" stroke-dasharray="10 10" />
  </g>

  <!-- Gekruiste Zwaarden -->
  
  <!-- Zwaard 1: Roze Hilt (Tegenstander / Attacker) -->
  <g transform="translate(256, 256) rotate(45) translate(-256, -256)">
    <!-- Kling -->
    <rect x="246" y="90" width="20" height="220" fill="url(#swordGrad)" rx="10" />
    <path d="M256,60 L266,90 L246,90 Z" fill="#f8fafc" />
    <!-- Pareerstang (Guard) -->
    <rect x="216" y="310" width="80" height="16" fill="url(#roseGrad)" rx="8" />
    <!-- Handvat -->
    <rect x="244" y="326" width="24" height="60" fill="#334155" rx="4" />
    <!-- Pommel -->
    <circle cx="256" cy="390" r="16" fill="url(#roseGrad)" />
  </g>

  <!-- Zwaard 2: Emerald Hilt (Jouw Team / Defender) -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Kling -->
    <rect x="246" y="90" width="20" height="220" fill="url(#swordGrad)" rx="10" />
    <path d="M256,60 L266,90 L246,90 Z" fill="#f8fafc" />
    <!-- Pareerstang (Guard) -->
    <rect x="216" y="310" width="80" height="16" fill="url(#emeraldGrad)" rx="8" />
    <!-- Handvat -->
    <rect x="244" y="326" width="24" height="60" fill="#334155" rx="4" />
    <!-- Pommel -->
    <circle cx="256" cy="390" r="16" fill="url(#emeraldGrad)" />
  </g>

  <!-- Centrale Hexagoon (Symboliseert de Battleplan/Matchup) -->
  <g filter="url(#glow)">
    <!-- Hexagoon -->
    <polygon points="256,200 304,228 304,284 256,312 208,284 208,228" fill="#0f172a" stroke="url(#emeraldGrad)" stroke-width="8" />
    <!-- Kern -->
    <circle cx="256" cy="256" r="16" fill="url(#roseGrad)" />
  </g>
</svg>